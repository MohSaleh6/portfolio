<script type="module">
/**
 * ==========================================================================
 * GPU PARAMETRIC PARTICLE ENGINE
 * ==========================================================================
 * Every surface is generated once on the CPU into a Float32Array, then the
 * morph between two surfaces runs entirely in the vertex shader: the GPU
 * interpolates each point between its "from" and "to" position using a single
 * uniform. Nothing walks 120,000 points per frame on the main thread, which is
 * why the transition stays smooth while the UI keeps responding.
 */

import * as THREE from 'three';
import { Stage, renderSceneFallback, supportsWebGL } from './assets/scene.js';

const boot = document.getElementById('boot');
const bootText = document.getElementById('boot-text');
const bootNote = document.getElementById('boot-note');

/* --------------------------------------------------------------------------
   SURFACE LIBRARY
   Each generator fills a Float32Array of xyz triples. They are pure functions
   of the point index, so the same index always maps to the same "identity"
   across shapes and the morph reads as a coherent transformation.
   -------------------------------------------------------------------------- */
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const SURFACES = {
    sphere: {
        label: 'Sphere', icon: 'fa-circle-notch',
        note: 'Fibonacci lattice — even area per point',
        build(out, count) {
            for (let i = 0; i < count; i++) {
                // Even distribution: equal-area bands in y, golden-angle in theta.
                const y = 1 - (i / (count - 1)) * 2;
                const radius = Math.sqrt(Math.max(0, 1 - y * y));
                const theta = GOLDEN_ANGLE * i;
                // Slight radial scatter turns a hard shell into a shell with depth.
                const r = 26 * (0.94 + Math.random() * 0.06);
                out[i * 3] = Math.cos(theta) * radius * r;
                out[i * 3 + 1] = y * r;
                out[i * 3 + 2] = Math.sin(theta) * radius * r;
            }
        }
    },

    helix: {
        label: 'DNA helix', icon: 'fa-dna',
        note: 'Two antiphase strands plus base-pair rungs',
        build(out, count) {
            const turns = 5, height = 54, radius = 15, tube = 1.5;
            const pairsPerTurn = 10;
            const pairCount = turns * pairsPerTurn;
            for (let i = 0; i < count; i++) {
                const t = i / count;
                const slot = i % 10;
                if (slot < 8) {
                    // Backbones: two strands half a turn out of phase, each given
                    // a little tube thickness so they read as ribbons not wires.
                    const angle = t * Math.PI * 2 * turns + (slot < 4 ? 0 : Math.PI);
                    const a = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(Math.random()) * tube;
                    out[i * 3] = Math.cos(angle) * radius + Math.cos(a) * r;
                    out[i * 3 + 1] = (t - 0.5) * height + Math.sin(a) * r;
                    out[i * 3 + 2] = Math.sin(angle) * radius + Math.sin(a) * r * 0.6;
                } else {
                    // Base pairs: snapped to discrete rungs, then spread evenly
                    // along the bar between the two strands.
                    const pair = Math.floor(t * pairCount);
                    const pt = pair / pairCount;
                    const angle = pt * Math.PI * 2 * turns;
                    const along = 1 - 2 * Math.random();   // -1..1 across the bar
                    out[i * 3] = Math.cos(angle) * radius * along;
                    out[i * 3 + 1] = (pt - 0.5) * height;
                    out[i * 3 + 2] = Math.sin(angle) * radius * along;
                }
            }
        }
    },

    knot: {
        label: 'Torus knot', icon: 'fa-life-ring',
        note: '(p,q) = (3,2) curve with a tubular shell',
        build(out, count) {
            const p = 2, q = 3, scale = 9, tube = 2.1;
            // Canonical (p,q) torus knot.
            const curve = (t, v) => {
                const c = 2 + Math.cos(q * t);
                v[0] = c * Math.cos(p * t) * scale;
                v[1] = c * Math.sin(p * t) * scale;
                v[2] = Math.sin(q * t) * scale;
            };
            const P = [0, 0, 0], Q = [0, 0, 0];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                curve(t, P);
                curve(t + 0.0025, Q);

                // Unit tangent, then two perpendiculars to sweep a round tube.
                let tx = Q[0] - P[0], ty = Q[1] - P[1], tz = Q[2] - P[2];
                const tl = Math.hypot(tx, ty, tz) || 1;
                tx /= tl; ty /= tl; tz /= tl;

                // cross(tangent, up); `up` is swapped if it is near-parallel.
                let ux = 0, uy = 0, uz = 1;
                if (Math.abs(tz) > 0.9) { ux = 1; uz = 0; }
                let nx = ty * uz - tz * uy;
                let ny = tz * ux - tx * uz;
                let nz = tx * uy - ty * ux;
                const nl = Math.hypot(nx, ny, nz) || 1;
                nx /= nl; ny /= nl; nz /= nl;

                const bx = ty * nz - tz * ny;
                const by = tz * nx - tx * nz;
                const bz = tx * ny - ty * nx;

                const a = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * tube;
                const ca = Math.cos(a) * r, sa = Math.sin(a) * r;

                out[i * 3] = P[0] + nx * ca + bx * sa;
                out[i * 3 + 1] = P[1] + ny * ca + by * sa;
                out[i * 3 + 2] = P[2] + nz * ca + bz * sa;
            }
        }
    },

    galaxy: {
        label: 'Galaxy', icon: 'fa-hurricane',
        note: 'Logarithmic spiral arms with a bulge core',
        build(out, count) {
            const arms = 4, spin = 2.4, maxR = 34;
            for (let i = 0; i < count; i++) {
                // Radius biased inward so the core stays dense.
                const t = Math.pow(Math.random(), 0.55);
                const radius = t * maxR;
                const arm = (i % arms) / arms * Math.PI * 2;
                const angle = arm + radius * 0.08 * spin;
                // Scatter widens with radius, the way real arms fray outward.
                const spread = 0.03 + t * 0.20;
                const jx = (Math.random() - 0.5) * radius * spread;
                const jy = (Math.random() - 0.5) * (3.2 - t * 1.4);
                const jz = (Math.random() - 0.5) * radius * spread;
                out[i * 3] = Math.cos(angle) * radius + jx;
                out[i * 3 + 1] = jy;
                out[i * 3 + 2] = Math.sin(angle) * radius + jz;
            }
        }
    },

    lattice: {
        label: 'Lattice', icon: 'fa-cubes',
        note: 'Axis-aligned line grid, 6 nodes per axis',
        build(out, count) {
            const cells = 5;               // 6 nodes per axis
            const size = 42, half = size / 2;
            const lines = cells + 1;
            const jitter = 0.28;
            for (let i = 0; i < count; i++) {
                // Each point belongs to one axis-aligned line of the grid and
                // slides freely along it, so the edges stay solid and the
                // interior stays open.
                const axis = i % 3;
                const idx = Math.floor(i / 3);
                const j = idx % lines;
                const k = Math.floor(idx / lines) % lines;

                const along = -half + Math.random() * size;
                const b = -half + (j / cells) * size + (Math.random() - 0.5) * jitter;
                const c = -half + (k / cells) * size + (Math.random() - 0.5) * jitter;

                if (axis === 0) { out[i*3] = along; out[i*3+1] = b; out[i*3+2] = c; }
                else if (axis === 1) { out[i*3] = b; out[i*3+1] = along; out[i*3+2] = c; }
                else { out[i*3] = b; out[i*3+1] = c; out[i*3+2] = along; }
            }
        }
    }
};

const PALETTES = [
    { id: 'ice',   label: 'Ice',   from: '#3ad8ff', to: '#4d6bff' },
    { id: 'ember', label: 'Ember', from: '#ffd166', to: '#ff3d6e' },
    { id: 'flora', label: 'Flora', from: '#7ef7a9', to: '#1e9fd4' },
    { id: 'orchid',label: 'Orchid',from: '#ff8ae2', to: '#7b5cff' }
];

/* --------------------------------------------------------------------------
   SHADERS
   -------------------------------------------------------------------------- */
const VERTEX_SHADER = /* glsl */`
    uniform float uMorph;      // 0 = from-surface, 1 = to-surface
    uniform float uTime;
    uniform float uSize;
    uniform float uScale;      // dispersion
    uniform vec3  uColorFrom;
    uniform vec3  uColorTo;

    attribute vec3  aTarget;   // destination position for the current morph
    attribute float aSeed;     // stable per-particle randomness
    attribute float aRamp;     // 0..1 position along the colour ramp

    varying vec3  vColor;
    varying float vFade;

    void main() {
        // Ease the morph per particle, offset by its seed, so the cloud
        // reorganises in a wave instead of every point arriving at once.
        float stagger = clamp((uMorph - aSeed * 0.25) / 0.75, 0.0, 1.0);
        float eased = stagger * stagger * (3.0 - 2.0 * stagger);
        vec3 morphed = mix(position, aTarget, eased);

        // Gentle breathing so a settled surface never looks like a still image.
        float wobble = sin(uTime * 0.8 + aSeed * 6.2831) * 0.35;
        morphed += normalize(morphed + 0.0001) * wobble;
        morphed *= uScale;

        vColor = mix(uColorFrom, uColorTo, aRamp);
        // Low base contribution; points in flight glow brighter, which reads as
        // energy during a morph without saturating the settled surface.
        vFade = 0.17 + 0.30 * sin(eased * 3.14159);

        vec4 mv = modelViewMatrix * vec4(morphed, 1.0);
        // Perspective-correct sizing: distant points shrink like real geometry.
        gl_PointSize = uSize * (300.0 / -mv.z) * (0.7 + aSeed * 0.6);
        gl_Position = projectionMatrix * mv;
    }
`;

const FRAGMENT_SHADER = /* glsl */`
    varying vec3  vColor;
    varying float vFade;

    void main() {
        // Soft round sprite: no texture fetch, and no square points.
        vec2 uv = gl_PointCoord - 0.5;
        float d = dot(uv, uv);
        if (d > 0.25) discard;
        float alpha = smoothstep(0.25, 0.0, d);
        // A restrained hot core keeps the highlight without washing to white.
        vec3 color = vColor + vec3(pow(alpha, 8.0)) * 0.22;
        gl_FragColor = vec4(color, alpha * vFade);
    }
`;

/* --------------------------------------------------------------------------
   ENGINE
   -------------------------------------------------------------------------- */
class ParticleEngine {
    constructor() {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isSmall = window.innerWidth < 900;
        this.count = isSmall ? 45000 : 120000;

        this.stage = new Stage(document.getElementById('stage'), {
            fov: 55, far: 600, shadows: false, environment: false,
            background: 0x04070d, exposure: 1
        });
        this.stage.camera.position.set(0, 16, 78);
        this.stage.controls.minDistance = 30;
        this.stage.controls.maxDistance = 190;
        this.stage.controls.autoRotate = !reduceMotion;
        this.stage.controls.autoRotateSpeed = 0.9;

        this.surfaceKeys = Object.keys(SURFACES);
        this.current = 'sphere';
        this.morphTween = null;

        this.#buildGeometry();
        this.#buildUI();
        this.#buildTelemetry();

        this.stage.onFrame((delta, elapsed) => {
            this.material.uniforms.uTime.value = elapsed;
            this.#stepMorph(delta);
            this.#stepTelemetry(delta);
        });
        this.stage.start();
    }

    /** Allocates the buffers and fills them with the starting surface. */
    #buildGeometry() {
        const count = this.count;
        this.buffers = {};
        for (const key of this.surfaceKeys) {
            const arr = new Float32Array(count * 3);
            SURFACES[key].build(arr, count);
            this.buffers[key] = arr;
        }

        const position = new Float32Array(this.buffers.sphere);   // live "from"
        const target = new Float32Array(this.buffers.sphere);     // live "to"
        const seed = new Float32Array(count);
        const ramp = new Float32Array(count);
        for (let i = 0; i < count; i++) {
            seed[i] = Math.random();
            ramp[i] = i / count;
        }

        this.geometry = new THREE.BufferGeometry();
        this.geometry.setAttribute('position', new THREE.BufferAttribute(position, 3));
        this.geometry.setAttribute('aTarget', new THREE.BufferAttribute(target, 3));
        this.geometry.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
        this.geometry.setAttribute('aRamp', new THREE.BufferAttribute(ramp, 1));
        // The cloud never leaves this radius, so a fixed sphere spares three.js
        // recomputing bounds over 120k points.
        this.geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 70);

        const palette = PALETTES[0];
        this.material = new THREE.ShaderMaterial({
            uniforms: {
                uMorph: { value: 1 },
                uTime: { value: 0 },
                uSize: { value: 0.55 },
                uScale: { value: 1 },
                uColorFrom: { value: new THREE.Color(palette.from) },
                uColorTo: { value: new THREE.Color(palette.to) }
            },
            vertexShader: VERTEX_SHADER,
            fragmentShader: FRAGMENT_SHADER,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.points = new THREE.Points(this.geometry, this.material);
        this.stage.scene.add(this.points);

        this.baseSize = 0.55;
        this.sizeFactor = 1;
    }

    /**
     * Starts a morph. The current on-screen positions are baked into the
     * "from" buffer first, so interrupting a morph mid-flight continues from
     * exactly where the points are rather than snapping back.
     */
    morphTo(key) {
        if (!SURFACES[key] || key === this.current) return;

        const from = this.geometry.attributes.position.array;
        const prevTarget = this.geometry.attributes.aTarget.array;
        const progress = this.material.uniforms.uMorph.value;

        if (progress < 1) {
            for (let i = 0; i < from.length; i++) {
                from[i] += (prevTarget[i] - from[i]) * progress;
            }
        } else {
            from.set(prevTarget);
        }
        prevTarget.set(this.buffers[key]);

        this.geometry.attributes.position.needsUpdate = true;
        this.geometry.attributes.aTarget.needsUpdate = true;
        this.material.uniforms.uMorph.value = 0;

        this.current = key;
        this.morphTween = { elapsed: 0, duration: 1.8 };

        document.getElementById('tel-shape').textContent = SURFACES[key].label;
        for (const btn of document.querySelectorAll('.shape-btn')) {
            btn.setAttribute('aria-pressed', String(btn.dataset.shape === key));
        }
        document.getElementById('shape-note').textContent = SURFACES[key].note;
    }

    #stepMorph(delta) {
        if (!this.morphTween) return;
        this.morphTween.elapsed += delta;
        const t = Math.min(this.morphTween.elapsed / this.morphTween.duration, 1);
        this.material.uniforms.uMorph.value = t;
        if (t >= 1) this.morphTween = null;
    }

    setPalette(palette) {
        this.material.uniforms.uColorFrom.value.set(palette.from);
        this.material.uniforms.uColorTo.value.set(palette.to);
        for (const btn of document.querySelectorAll('.palette-btn')) {
            btn.setAttribute('aria-pressed', String(btn.dataset.palette === palette.id));
        }
    }

    /* ---------------- UI wiring ---------------- */
    #buildUI() {
        const grid = document.getElementById('shape-grid');
        grid.innerHTML = this.surfaceKeys.map(key => `
            <button type="button" class="shape-btn" data-shape="${key}"
                    aria-pressed="${key === this.current}">
                <i class="fas ${SURFACES[key].icon}" aria-hidden="true"></i>
                ${SURFACES[key].label}
            </button>`).join('');
        const note = document.createElement('p');
        note.id = 'shape-note';
        note.style.cssText = 'margin-top:10px;font-family:var(--font-mono);font-size:10px;line-height:1.7;color:var(--text-muted);';
        note.textContent = SURFACES[this.current].note;
        grid.after(note);
        grid.addEventListener('click', (e) => {
            const btn = e.target.closest('.shape-btn');
            if (btn) this.morphTo(btn.dataset.shape);
        });

        const palette = document.getElementById('palette-row');
        palette.innerHTML = PALETTES.map((p, i) => `
            <button type="button" class="palette-btn" data-palette="${p.id}"
                    title="${p.label}" aria-label="${p.label} colour ramp"
                    aria-pressed="${i === 0}"
                    style="background:linear-gradient(135deg, ${p.from}, ${p.to});"></button>`).join('');
        palette.addEventListener('click', (e) => {
            const btn = e.target.closest('.palette-btn');
            if (btn) this.setPalette(PALETTES.find(p => p.id === btn.dataset.palette));
        });

        const spin = document.getElementById('in-spin');
        spin.addEventListener('input', () => {
            const v = parseFloat(spin.value);
            this.stage.controls.autoRotateSpeed = v * 0.9;
            this.stage.controls.autoRotate = v > 0;
            document.getElementById('val-spin').textContent = v.toFixed(1) + '×';
        });

        const scale = document.getElementById('in-scale');
        scale.addEventListener('input', () => {
            const v = parseInt(scale.value, 10);
            this.material.uniforms.uScale.value = v / 100;
            document.getElementById('val-scale').textContent = v + '%';
        });

        const size = document.getElementById('in-size');
        size.addEventListener('input', () => {
            const v = parseFloat(size.value);
            this.sizeFactor = v;
            this.material.uniforms.uSize.value = this.baseSize * v;
            document.getElementById('val-size').textContent = v.toFixed(1) + '×';
        });

        document.getElementById('btn-reset').addEventListener('click', () => this.resetView());
    }

    /** Eases the camera home without fighting OrbitControls' auto-rotation. */
    resetView() {
        const controls = this.stage.controls;
        const wasAuto = controls.autoRotate;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        const start = this.stage.camera.position.clone();
        const end = new THREE.Vector3(0, 16, 78);
        const duration = 0.9;
        let t = 0;

        const stop = this.stage.onFrame((delta) => {
            t = Math.min(t + delta / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            this.stage.camera.position.lerpVectors(start, end, eased);
            if (t >= 1) { controls.autoRotate = wasAuto; stop(); }
        });
    }

    /* ---------------- telemetry ---------------- */
    #buildTelemetry() {
        document.getElementById('tel-count').textContent = this.count.toLocaleString();
        document.getElementById('tel-shape').textContent = SURFACES[this.current].label;
        this.frames = 0;
        this.fpsTimer = 0;
    }

    #stepTelemetry(delta) {
        this.frames++;
        this.fpsTimer += delta;
        if (this.fpsTimer >= 0.5) {
            const fps = this.frames / this.fpsTimer;
            document.getElementById('tel-fps').textContent = fps.toFixed(0) + ' fps';
            document.getElementById('tel-calls').textContent = this.stage.renderer.info.render.calls;
            this.frames = 0;
            this.fpsTimer = 0;
        }
    }
}

/* --------------------------------------------------------------------------
   BOOT
   -------------------------------------------------------------------------- */
function dismissBoot() {
    boot.classList.add('is-done');
    setTimeout(() => { boot.hidden = true; }, 520);
}

function failBoot(message) {
    boot.classList.add('has-error');
    bootText.textContent = 'WebGL unavailable';
    bootNote.hidden = false;
    bootNote.textContent = message;
    renderSceneFallback(document.getElementById('stage'), message);
    document.querySelector('.controls')?.setAttribute('hidden', '');
    // The overlay stays, so keep the way out reachable above it.
    const exit = document.querySelector('.back-link');
    if (exit) {
        exit.style.position = 'fixed';
        exit.style.zIndex = '10000';
        exit.style.top = '24px';
        exit.style.right = '24px';
    }
}

if (!supportsWebGL()) {
    failBoot('This engine renders 120,000 points on the GPU and needs hardware-accelerated WebGL.');
} else {
    try {
        window.engine = new ParticleEngine();
        requestAnimationFrame(() => setTimeout(dismissBoot, 260));
    } catch (err) {
        console.error('Particle engine failed to start:', err);
        failBoot('The 3D context could not be created on this device.');
    }
}
</script>
