<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGL Engine | Particle Simulator</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syncopate:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Three.js & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* =========================================
           CORE SYSTEM VARIABLES & BASE
           ========================================= */
        :root {
            --bg-dark: #020305; --panel-bg: rgba(10, 15, 24, 0.85); --border-color: rgba(74, 144, 226, 0.2);
            --primary: #4A90E2; --secondary: #FF9F1C; --text-main: #f8fafc; --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; user-select: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* =========================================
           UI ARCHITECTURE (GLASSMORPHISM)
           ========================================= */
        .ui-layer { position: relative; z-index: 10; pointer-events: none; width: 100vw; height: 100vh; display: flex; justify-content: space-between; padding: 30px; }
        .interactive { pointer-events: all; }

        /* Left Panel: Telemetry & Info */
        .info-panel { display: flex; flex-direction: column; gap: 20px; }
        .brand { font-family: 'Syncopate', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px rgba(74, 144, 226, 0.5); }
        .brand span { color: var(--primary); }
        .brand-subtitle { font-family: 'Share Tech Mono', monospace; color: var(--text-muted); font-size: 12px; letter-spacing: 4px; margin-top: 5px; }

        .telemetry-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 280px; }
        .telemetry-row { display: flex; justify-content: space-between; font-family: 'Share Tech Mono', monospace; font-size: 13px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .telemetry-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .tel-label { color: var(--text-muted); }
        .tel-value { color: var(--secondary); font-weight: bold; }

        .instructions { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--primary); background: rgba(74, 144, 226, 0.1); padding: 10px 15px; border-left: 3px solid var(--primary); border-radius: 4px; margin-top: auto; }

        /* Right Panel: Engine Controls */
        .controls-panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); width: 320px; display: flex; flex-direction: column; gap: 25px; height: fit-content; max-height: 90vh; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .panel-title { font-family: 'Syncopate', sans-serif; font-size: 16px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* Control Sections */
        .control-group { display: flex; flex-direction: column; gap: 10px; }
        .group-label { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .engine-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); font-family: 'Share Tech Mono', monospace; padding: 12px 10px; font-size: 12px; cursor: pointer; transition: all 0.3s; border-radius: 8px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .engine-btn:hover, .engine-btn.active { background: rgba(74, 144, 226, 0.2); border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(74, 144, 226, 0.3); }

        /* Color Themes */
        .theme-grid { display: flex; gap: 10px; }
        .theme-btn { flex: 1; height: 35px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .theme-btn:hover, .theme-btn.active { border-color: #fff; transform: scale(1.05); }
        .t-cyber { background: linear-gradient(45deg, #00f2fe, #4facfe); }
        .t-matrix { background: linear-gradient(45deg, #0ba360, #3cba92); }
        .t-magma { background: linear-gradient(45deg, #f12711, #f5af19); }

        /* Sliders */
        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Return Button */
        .btn-return { position: fixed; top: 30px; left: 30px; z-index: 100; background: rgba(10, 15, 24, 0.8); border: 1px solid var(--border-color); color: var(--text-main); font-family: 'Share Tech Mono', monospace; padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; text-decoration: none; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px); }
        .btn-return:hover { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        /* Preloader */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Share Tech Mono', monospace; color: var(--primary); transition: opacity 0.5s; }
        .loader-ring { width: 80px; height: 80px; border: 2px solid transparent; border-top-color: var(--primary); border-bottom-color: var(--secondary); border-radius: 50%; animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 900px) {
            .ui-layer { padding: 15px; flex-direction: column; pointer-events: none; justify-content: flex-end; }
            .btn-return { top: 15px; left: 15px; padding: 10px 15px; font-size: 12px; }
            .info-panel { display: none; } /* Hide info on mobile to save space for controls */
            .controls-panel { width: 100%; max-height: 40vh; padding: 15px; gap: 15px; border-radius: 16px 16px 0 0; }
            .panel-title { padding-bottom: 10px; font-size: 14px; }
            .btn-grid { grid-template-columns: 1fr 1fr; }
            .engine-btn { padding: 8px; font-size: 10px; }
            .instructions { display: block; position: fixed; top: 70px; left: 15px; z-index: 100; pointer-events: none; }
        }
    </style>
</head>
<body>

    <!-- BOOTLOADER -->
    <div id="loader">
        <div class="loader-ring"></div>
        <div id="loader-text">COMPILING WEBGL SHADERS...</div>
    </div>

    <!-- RETURN TO PORTFOLIO -->
    <a href="index.html" class="btn-return interactive">
        <i class="fas fa-arrow-left"></i> EXIT ENGINE
    </a>

    <!-- 3D CANVAS -->
    <div id="webgl-canvas"></div>

    <!-- UI OVERLAYS -->
    <div class="ui-layer">
        
        <!-- LEFT: TELEMETRY -->
        <div class="info-panel">
            <div class="brand">WEBGL<span>.</span>ENGINE<div class="brand-subtitle">V 3.1.4 // GPU ACCELERATED</div></div>
            
            <div class="telemetry-box">
                <div class="telemetry-row"><span class="tel-label">RENDER_FPS:</span> <span class="tel-value" id="fps-val">60.0</span></div>
                <div class="telemetry-row"><span class="tel-label">VERTICES:</span> <span class="tel-value" id="vert-val">50,000</span></div>
                <div class="telemetry-row"><span class="tel-label">GEOMETRY:</span> <span class="tel-value" id="geo-val">SPHERE_CORE</span></div>
                <div class="telemetry-row"><span class="tel-label">CAMERA_Z:</span> <span class="tel-value" id="cam-val">150.00</span></div>
            </div>

            <div class="instructions">
                [ DRAG TO ROTATE ]<br>[ SCROLL TO ZOOM ]
            </div>
        </div>

        <!-- RIGHT: CONTROL PANEL -->
        <div class="controls-panel interactive">
            <div class="panel-title"><i class="fas fa-sliders-h" style="color: var(--primary);"></i> Engine Controls</div>

            <!-- Morphing Controls -->
            <div class="control-group">
                <div class="group-label">Mathematical Morphing</div>
                <div class="btn-grid">
                    <button class="engine-btn active" onclick="Engine.morphTo('sphere', this)"><i class="fas fa-globe"></i> Quantum Sphere</button>
                    <button class="engine-btn" onclick="Engine.morphTo('dna', this)"><i class="fas fa-dna"></i> DNA Helix</button>
                    <button class="engine-btn" onclick="Engine.morphTo('torus', this)"><i class="fas fa-life-ring"></i> Torus Core</button>
                    <button class="engine-btn" onclick="Engine.morphTo('chaos', this)"><i class="fas fa-meteor"></i> Chaos Cloud</button>
                </div>
            </div>

            <!-- Color Themes -->
            <div class="control-group">
                <div class="group-label">Color Spectrum</div>
                <div class="theme-grid">
                    <button class="theme-btn t-cyber active" onclick="Engine.setTheme(0x00f2fe, 0x4facfe, this)"></button>
                    <button class="theme-btn t-matrix" onclick="Engine.setTheme(0x0ba360, 0x3cba92, this)"></button>
                    <button class="theme-btn t-magma" onclick="Engine.setTheme(0xf12711, 0xf5af19, this)"></button>
                </div>
            </div>

            <!-- Physics Controls -->
            <div class="control-group">
                <div class="group-label">Rotation Speed: <span id="speed-val" style="color: var(--secondary);">1.0x</span></div>
                <div class="slider-container">
                    <i class="fas fa-snowflake" style="color: var(--text-muted); font-size: 12px;"></i>
                    <input type="range" min="0" max="3" step="0.1" value="1" oninput="Engine.setSpeed(this.value)">
                    <i class="fas fa-fire" style="color: var(--text-muted); font-size: 12px;"></i>
                </div>
            </div>
            
            <div class="control-group">
                <div class="group-label">Particle Dispersion: <span id="dispersion-val" style="color: var(--secondary);">100%</span></div>
                <div class="slider-container">
                    <i class="fas fa-compress-arrows-alt" style="color: var(--text-muted); font-size: 12px;"></i>
                    <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="Engine.setDispersion(this.value)">
                    <i class="fas fa-expand-arrows-alt" style="color: var(--text-muted); font-size: 12px;"></i>
                </div>
            </div>

            <button class="engine-btn" onclick="Engine.resetCamera()" style="margin-top: 10px; width: 100%;">
                <i class="fas fa-crosshairs"></i> Reset Camera Origin
            </button>
        </div>

    </div>

    <!-- ENGINE LOGIC -->
    <script>
        /**
         * =======================================================
         * WEBGL PARAMETRIC PARTICLE ENGINE
         * Architected by ENG. MOHAMMAD SALEH
         * Core: Three.js, Math, BufferGeometry, OrbitControls
         * =======================================================
         */

        class ParticleEngine {
            constructor() {
                // System Constants
                this.particleCount = window.innerWidth < 768 ? 25000 : 50000;
                this.container = document.getElementById('webgl-canvas');
                this.currentShape = 'sphere';
                this.rotationSpeed = 1.0;
                this.dispersion = 1.0;
                
                // Arrays to hold coordinate targets for morphing
                this.shapes = {
                    sphere: new Float32Array(this.particleCount * 3),
                    dna: new Float32Array(this.particleCount * 3),
                    torus: new Float32Array(this.particleCount * 3),
                    chaos: new Float32Array(this.particleCount * 3)
                };

                this.initScene();
                this.calculateGeometries();
                this.initParticles();
                this.initTelemetry();
                this.removeLoader();
                
                window.addEventListener('resize', () => this.onWindowResize());
                this.animate();
            }

            // 1. Setup Three.js Environment
            initScene() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x020305, 0.002); // Deep space fog

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
                this.camera.position.set(0, 30, 150);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.container.appendChild(this.renderer.domElement);

                // Setup Orbit Controls
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 1.0;
                this.controls.enablePan = false;
                this.controls.minDistance = 50;
                this.controls.maxDistance = 500;
            }

            // 2. Mathematical Generation of Shapes
            calculateGeometries() {
                // Helper variables
                let r, theta, phi, x, y, z;

                for (let i = 0; i < this.particleCount; i++) {
                    const i3 = i * 3;

                    // --- SHAPE 1: QUANTUM SPHERE (Fibonacci Distribution) ---
                    const goldenRatio = (1 + Math.sqrt(5)) / 2;
                    theta = 2 * Math.PI * i / goldenRatio;
                    phi = Math.acos(1 - 2 * (i + 0.5) / this.particleCount);
                    r = 60; // radius
                    this.shapes.sphere[i3] = r * Math.sin(phi) * Math.cos(theta);
                    this.shapes.sphere[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    this.shapes.sphere[i3 + 2] = r * Math.cos(phi);

                    // --- SHAPE 2: DNA HELIX ---
                    const t = i / this.particleCount * Math.PI * 20; // Twists
                    r = 30;
                    const strandOffset = (i % 2 === 0) ? 0 : Math.PI; // Double strand
                    this.shapes.dna[i3] = r * Math.cos(t + strandOffset);
                    this.shapes.dna[i3 + 1] = (i / this.particleCount * 200) - 100; // Height
                    this.shapes.dna[i3 + 2] = r * Math.sin(t + strandOffset);

                    // --- SHAPE 3: TORUS CORE (Donut) ---
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    const tubeR = 25;
                    const mainR = 50;
                    this.shapes.torus[i3] = (mainR + tubeR * Math.cos(v)) * Math.cos(u);
                    this.shapes.torus[i3 + 1] = tubeR * Math.sin(v);
                    this.shapes.torus[i3 + 2] = (mainR + tubeR * Math.cos(v)) * Math.sin(u);

                    // --- SHAPE 4: CHAOS CLOUD ---
                    this.shapes.chaos[i3] = (Math.random() - 0.5) * 200;
                    this.shapes.chaos[i3 + 1] = (Math.random() - 0.5) * 200;
                    this.shapes.chaos[i3 + 2] = (Math.random() - 0.5) * 200;
                }
            }

            // 3. Initialize Buffer Geometry
            initParticles() {
                this.geometry = new THREE.BufferGeometry();
                
                // Copy initial shape (Sphere) to current positions array
                const positions = new Float32Array(this.particleCount * 3);
                for(let i=0; i<positions.length; i++) positions[i] = this.shapes.sphere[i];
                
                this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                // Create custom colors array for gradient effect
                const colors = new Float32Array(this.particleCount * 3);
                const color1 = new THREE.Color(0x00f2fe);
                const color2 = new THREE.Color(0x4facfe);
                
                for(let i=0; i<this.particleCount; i++) {
                    const mixRatio = i / this.particleCount;
                    const mixedColor = color1.clone().lerp(color2, mixRatio);
                    colors[i*3] = mixedColor.r;
                    colors[i*3+1] = mixedColor.g;
                    colors[i*3+2] = mixedColor.b;
                }
                this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                this.material = new THREE.PointsMaterial({
                    size: window.innerWidth < 768 ? 1.5 : 1.0,
                    vertexColors: true,
                    blending: THREE.AdditiveBlending, // Gives the glowing effect
                    depthWrite: false, // Prevents particles from occluding each other
                    transparent: true,
                    opacity: 0.8
                });

                this.particles = new THREE.Points(this.geometry, this.material);
                this.scene.add(this.particles);
            }

            // 4. Engine Controls API (Connected to UI Buttons)
            morphTo(targetShape, btnElement) {
                // Update UI Buttons
                document.querySelectorAll('.engine-btn').forEach(btn => btn.classList.remove('active'));
                if(btnElement) btnElement.classList.add('active');
                
                this.currentShape = targetShape;
                document.getElementById('geo-val').innerText = targetShape.toUpperCase();
                
                // Animate Vertices using GSAP
                const positions = this.geometry.attributes.position.array;
                const targets = this.shapes[targetShape];
                
                gsap.to(positions, {
                    endArray: targets,
                    duration: 2.0,
                    ease: "power3.inOut",
                    onUpdate: () => {
                        this.geometry.attributes.position.needsUpdate = true;
                    }
                });
            }

            setTheme(c1Hex, c2Hex, btnElement) {
                // Update UI Buttons
                document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
                if(btnElement) btnElement.classList.add('active');

                const colors = this.geometry.attributes.color.array;
                const color1 = new THREE.Color(c1Hex);
                const color2 = new THREE.Color(c2Hex);
                
                // Animate Colors
                const dummy = { v: 0 };
                gsap.to(dummy, {
                    v: 1,
                    duration: 1.5,
                    onUpdate: () => {
                        for(let i=0; i<this.particleCount; i++) {
                            const mixRatio = i / this.particleCount;
                            const finalColor = color1.clone().lerp(color2, mixRatio);
                            colors[i*3] = finalColor.r;
                            colors[i*3+1] = finalColor.g;
                            colors[i*3+2] = finalColor.b;
                        }
                        this.geometry.attributes.color.needsUpdate = true;
                    }
                });
            }

            setSpeed(val) {
                this.rotationSpeed = parseFloat(val);
                this.controls.autoRotateSpeed = this.rotationSpeed;
                document.getElementById('speed-val').innerText = this.rotationSpeed.toFixed(1) + 'x';
            }

            setDispersion(val) {
                this.dispersion = parseFloat(val);
                document.getElementById('dispersion-val').innerText = Math.round(this.dispersion * 100) + '%';
                
                // Update scale of the entire particle system
                gsap.to(this.particles.scale, {
                    x: this.dispersion, y: this.dispersion, z: this.dispersion,
                    duration: 1.0, ease: "back.out(1.5)"
                });
            }

            resetCamera() {
                gsap.to(this.camera.position, {
                    x: 0, y: 30, z: 150,
                    duration: 1.5, ease: "power2.inOut"
                });
                this.controls.target.set(0, 0, 0);
            }

            // 5. Telemetry & Core Loop
            initTelemetry() {
                document.getElementById('vert-val').innerText = this.particleCount.toLocaleString();
                this.frames = 0;
                this.lastTime = performance.now();
                this.fpsEl = document.getElementById('fps-val');
                this.camEl = document.getElementById('cam-val');
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            removeLoader() {
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    document.getElementById('loader-text').innerText = "ENGINE READY. INITIALIZING...";
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 500);
                        
                        // Entrance Animation
                        gsap.from('.info-panel', { x: -50, opacity: 0, duration: 1, ease: "power3.out", delay: 0.5 });
                        gsap.from('.controls-panel', { x: 50, opacity: 0, duration: 1, ease: "power3.out", delay: 0.5 });
                        gsap.from('.btn-return', { y: -20, opacity: 0, duration: 1, delay: 0.8 });
                    }, 800);
                }, 1500);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Subtle organic floating effect for vertices
                if(this.currentShape === 'sphere' || this.currentShape === 'torus') {
                    const time = Date.now() * 0.001;
                    const positions = this.geometry.attributes.position.array;
                    // Only animate a subset to save CPU, this gives a twinkling/breathing effect
                    for(let i=0; i<1000; i++) {
                        const idx = Math.floor(Math.random() * this.particleCount) * 3;
                        positions[idx+1] += Math.sin(time + positions[idx]) * 0.1;
                    }
                    this.geometry.attributes.position.needsUpdate = true;
                }

                this.controls.update(); // Required for damping and auto-rotate
                this.renderer.render(this.scene, this.camera);

                // Update Telemetry
                this.frames++;
                const now = performance.now();
                if (now - this.lastTime >= 1000) {
                    this.fpsEl.innerText = Math.round((this.frames * 1000) / (now - this.lastTime)).toFixed(1);
                    this.frames = 0; this.lastTime = now;
                    if(this.camEl) this.camEl.innerText = Math.round(this.camera.position.z).toFixed(2);
                }
            }
        }

        // Boot the Engine
        const Engine = new ParticleEngine();

    </script>
</body>
</html>
