<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Engine | Automotive Telemetry</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050608; --panel-bg: rgba(12, 16, 24, 0.85); --border-core: rgba(74, 144, 226, 0.2);
            --primary: #4A90E2; --accent: #FF9F1C; --danger: #ff3333; --success: #00ff41; --text-main: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at center, rgba(74, 144, 226, 0.05), transparent 60%); }

        /* HEADER */
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-core); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .brand { font-family: 'Syncopate', sans-serif; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .brand span { color: var(--primary); }
        .status-indicator { display: flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--accent); border: 1px solid rgba(255, 159, 28, 0.3); padding: 6px 15px; border-radius: 4px; background: rgba(255, 159, 28, 0.1); }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: blink 1s infinite; }
        
        .btn-return { color: var(--text-main); text-decoration: none; font-family: 'Share Tech Mono', monospace; font-size: 12px; border: 1px solid var(--border-core); padding: 8px 15px; border-radius: 4px; transition: 0.3s; }
        .btn-return:hover { background: var(--danger); border-color: var(--danger); }

        /* MAIN GRID */
        .dashboard-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; padding: 30px 40px; }
        
        .panel { background: var(--panel-bg); border: 1px solid var(--border-core); border-radius: 12px; padding: 25px; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .panel-header { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; border-bottom: 1px dashed var(--border-core); padding-bottom: 10px; display: flex; justify-content: space-between; }
        
        /* GAUGES (Left & Right) */
        .gauge-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { width: 100%; max-width: 300px; height: auto; }
        .gauge-value-overlay { position: absolute; text-align: center; top: 50%; left: 50%; transform: translate(-50%, -20%); }
        .g-val { font-size: 45px; font-weight: 700; font-family: 'Share Tech Mono', monospace; line-height: 1; }
        .g-unit { font-size: 12px; color: var(--text-muted); letter-spacing: 2px; }

        /* CENTER: CAR VITALS & WIREFRAME */
        .vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .vital-box { border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; }
        .v-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; font-family: 'Share Tech Mono'; }
        .v-value { font-size: 20px; font-weight: bold; color: var(--primary); font-family: 'Share Tech Mono'; }
        .v-value.warning { color: var(--accent); }

        .car-wireframe { flex: 1; border: 1px solid rgba(74, 144, 226, 0.1); background: radial-gradient(circle, rgba(74, 144, 226, 0.1) 0%, transparent 70%); border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .svg-car { width: 80%; opacity: 0.8; stroke: var(--primary); stroke-width: 2; fill: none; filter: drop-shadow(0 0 5px var(--primary)); }
        
        /* SCANNER & TERMINAL */
        .terminal-box { flex: 1; background: #000; border: 1px solid #333; border-radius: 6px; padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--success); overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .log-error { color: var(--danger); text-shadow: 0 0 5px var(--danger); }
        .log-warn { color: var(--accent); }
        .log-sys { color: var(--text-muted); }

        .btn-action { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 15px; border-radius: 6px; text-transform: uppercase; }
        .btn-action:hover { background: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(74, 144, 226, 0.4); }
        .btn-action.btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-action.btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 51, 51, 0.4); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; overflow-y: auto; }
            body { height: auto; overflow-y: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><i class="fas fa-microchip"></i> IoT<span>.</span>TELEMETRY</div>
        <div class="status-indicator"><div class="pulse"></div> PROTOCOL: CAN-BUS (OBD-II)</div>
        <a href="index.html" class="btn-return"><i class="fas fa-sign-out-alt"></i> DISCONNECT</a>
    </header>

    <div class="dashboard-grid">
        
        <!-- LEFT: ENGINE RPM GAUGE -->
        <div class="panel">
            <div class="panel-header"><span>Engine Dynamics</span> <i class="fas fa-tachometer-alt"></i></div>
            <div class="gauge-container">
                <canvas id="rpmGauge" width="300" height="300"></canvas>
                <div class="gauge-value-overlay">
                    <div class="g-val" id="rpm-val">0</div>
                    <div class="g-unit">RPM x1000</div>
                </div>
            </div>
            <button class="btn-action" id="btn-engine" onclick="EngineSim.toggleEngine()">START ENGINE <i class="fas fa-power-off"></i></button>
        </div>

        <!-- CENTER: VITALS & WIREFRAME -->
        <div class="panel">
            <div class="panel-header"><span>Vehicle ECU Diagnostics</span> <i class="fas fa-car"></i></div>
            <div class="vitals-grid">
                <div class="vital-box">
                    <div class="v-label">Coolant Temp</div>
                    <div class="v-value" id="temp-val">-- °C</div>
                </div>
                <div class="vital-box">
                    <div class="v-label">Battery Voltage</div>
                    <div class="v-value" id="volt-val">12.1 V</div>
                </div>
                <div class="vital-box">
                    <div class="v-label">Oil Pressure</div>
                    <div class="v-value" id="oil-val">-- kPa</div>
                </div>
                <div class="vital-box">
                    <div class="v-label">Mass Air Flow</div>
                    <div class="v-value" id="maf-val">-- g/s</div>
                </div>
            </div>
            <div class="car-wireframe">
                <!-- SVG Wireframe Car Top View -->
                <svg class="svg-car" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,30 Q50,10 80,30 L90,80 L90,160 Q50,180 10,160 L10,80 Z" />
                    <rect x="25" y="45" width="50" height="30" rx="5" stroke="rgba(255,255,255,0.3)"/>
                    <rect x="25" y="110" width="50" height="30" rx="5" stroke="rgba(255,255,255,0.3)"/>
                    <!-- Wheels -->
                    <rect x="5" y="40" width="10" height="25" rx="2" fill="var(--primary)"/>
                    <rect x="85" y="40" width="10" height="25" rx="2" fill="var(--primary)"/>
                    <rect x="5" y="130" width="10" height="25" rx="2" fill="var(--primary)"/>
                    <rect x="85" y="130" width="10" height="25" rx="2" fill="var(--primary)"/>
                </svg>
            </div>
        </div>

        <!-- RIGHT: SPEEDOMETER & SCANNER -->
        <div class="panel">
            <div class="panel-header"><span>Velocity & OBD-II Log</span> <i class="fas fa-terminal"></i></div>
            <div class="gauge-container" style="height: 200px;">
                <canvas id="speedGauge" width="300" height="300"></canvas>
                <div class="gauge-value-overlay">
                    <div class="g-val" id="speed-val" style="color: var(--primary);">0</div>
                    <div class="g-unit">KM/H</div>
                </div>
            </div>
            
            <div class="terminal-box" id="obd-terminal">
                <span class="log-sys">> SYSTEM INITIALIZED</span>
                <span class="log-sys">> AWAITING IGNITION COMMAND...</span>
            </div>
            <button class="btn-action btn-danger" onclick="EngineSim.runDiagnostics()">RUN DEEP SCAN (DTC) <i class="fas fa-search"></i></button>
        </div>

    </div>

    <script>
        /**
         * ==========================================
         * CUSTOM CANVAS GAUGE ENGINE (Trigonometry)
         * Engineered by Mohammad Saleh
         * ==========================================
         */
        class CanvasGauge {
            constructor(canvasId, maxVal, color) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.max = maxVal;
                this.color = color;
                this.currentVal = 0;
                this.targetVal = 0;
                this.draw();
            }

            setVal(val) { this.targetVal = Math.min(Math.max(val, 0), this.max); }

            draw() {
                // Smooth Lerp
                this.currentVal += (this.targetVal - this.currentVal) * 0.1;
                
                const ctx = this.ctx;
                const w = this.canvas.width; const h = this.canvas.height;
                const cx = w / 2; const cy = h / 2; const r = w / 2 - 20;

                ctx.clearRect(0, 0, w, h);

                // Draw Background Arc
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0.75 * Math.PI, 2.25 * Math.PI);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 15;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw Value Arc
                const pct = this.currentVal / this.max;
                const endAngle = 0.75 * Math.PI + (1.5 * Math.PI * pct);
                
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0.75 * Math.PI, endAngle);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 15;
                ctx.stroke();

                // Draw Ticks
                for(let i=0; i<=10; i++) {
                    const angle = 0.75 * Math.PI + (1.5 * Math.PI * (i/10));
                    const isDanger = i >= 8;
                    const x1 = cx + (r - 20) * Math.cos(angle);
                    const y1 = cy + (r - 20) * Math.sin(angle);
                    const x2 = cx + (r - 30) * Math.cos(angle);
                    const y2 = cy + (r - 30) * Math.sin(angle);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                    ctx.strokeStyle = isDanger ? '#ff3333' : 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                requestAnimationFrame(() => this.draw());
            }
        }

        /**
         * ==========================================
         * AUTOMOTIVE SIMULATION LOGIC
         * ==========================================
         */
        class AutomotiveSim {
            constructor() {
                this.rpmGauge = new CanvasGauge('rpmGauge', 8000, '#FF9F1C');
                this.speedGauge = new CanvasGauge('speedGauge', 260, '#4A90E2');
                this.terminal = document.getElementById('obd-terminal');
                
                this.isRunning = false;
                this.rpm = 0; this.speed = 0;
                this.temp = 40; this.volt = 12.1;
                
                this.initSimLoop();
            }

            log(msg, type = 'sys') {
                const el = document.createElement('span');
                el.className = `log-${type}`;
                const time = new Date().toLocaleTimeString();
                el.innerText = `[${time}] ${msg}`;
                this.terminal.appendChild(el);
                this.terminal.scrollTop = this.terminal.scrollHeight;
            }

            toggleEngine() {
                const btn = document.getElementById('btn-engine');
                this.isRunning = !this.isRunning;
                
                if(this.isRunning) {
                    btn.innerHTML = 'CUT IGNITION <i class="fas fa-times"></i>';
                    btn.style.borderColor = 'var(--danger)'; btn.style.color = 'var(--danger)';
                    this.log('> IGNITION SEQUENCE INITIATED', 'warn');
                    setTimeout(() => {
                        this.log('> CRANKING ENGINE...', 'sys');
                        this.rpm = 1200; // Cold start flare
                        setTimeout(() => {
                            this.rpm = 800; // Idle
                            this.volt = 14.2; // Alternator charging
                            document.getElementById('volt-val').innerText = '14.2 V';
                            document.getElementById('oil-val').innerText = '250 kPa';
                            document.getElementById('maf-val').innerText = '4.5 g/s';
                            this.log('> ENGINE IDLE STABLE. CLOSED LOOP.', 'success');
                        }, 1000);
                    }, 500);
                } else {
                    btn.innerHTML = 'START ENGINE <i class="fas fa-power-off"></i>';
                    btn.style.borderColor = 'var(--primary)'; btn.style.color = 'var(--primary)';
                    this.rpm = 0; this.speed = 0; this.volt = 12.1;
                    document.getElementById('volt-val').innerText = '12.1 V';
                    document.getElementById('oil-val').innerText = '-- kPa';
                    document.getElementById('maf-val').innerText = '-- g/s';
                    this.log('> IGNITION CUT. SYSTEM OFF.', 'sys');
                }
            }

            runDiagnostics() {
                if(!this.isRunning) {
                    this.log('> ERROR: ENGINE MUST BE RUNNING FOR DEEP SCAN.', 'error');
                    return;
                }
                
                this.log('> INITIATING ISO 15765-4 CAN (11 bit ID, 500 Kbaud)...', 'warn');
                
                setTimeout(() => this.log('> REQUESTING EMISSION RELATED DTCs (MODE 03)...', 'sys'), 1000);
                setTimeout(() => {
                    this.log('> FOUND: P0171 - System Too Lean (Bank 1)', 'error');
                    document.getElementById('maf-val').classList.add('warning');
                }, 2500);
                setTimeout(() => this.log('> FOUND: U0100 - Lost Communication with ECM/PCM', 'error'), 3000);
                setTimeout(() => this.log('> SCAN COMPLETE. 2 DTCs DETECTED.', 'warn'), 3500);
            }

            initSimLoop() {
                setInterval(() => {
                    if(!this.isRunning) return;

                    // Simulate slight idle fluctuation
                    let targetRpm = 800 + (Math.random() * 50 - 25);
                    
                    // Simulate random revving occasionally
                    if(Math.random() > 0.85) {
                        targetRpm = 2500 + Math.random() * 2000;
                        this.speed = Math.min(this.speed + Math.random() * 15, 120);
                        this.log(`> THROTTLE BLIP DETECTED (TPS: ${Math.round(Math.random()*40+10)}%)`, 'sys');
                    } else {
                        // Gradual speed decrease if not revving
                        this.speed = Math.max(this.speed - 2, 0);
                    }

                    // Engine Temp warming up
                    if(this.temp < 92) {
                        this.temp += 0.5;
                        document.getElementById('temp-val').innerText = Math.round(this.temp) + ' °C';
                    }

                    // Update UI
                    this.rpmGauge.setVal(targetRpm);
                    this.speedGauge.setVal(this.speed);
                    
                    document.getElementById('rpm-val').innerText = Math.round(targetRpm);
                    document.getElementById('speed-val').innerText = Math.round(this.speed);
                    
                    // Dynamic MAF based on RPM
                    document.getElementById('maf-val').innerText = (targetRpm * 0.005).toFixed(1) + ' g/s';

                }, 800);
            }
        }

        const EngineSim = new AutomotiveSim();

    </script>
</body>
</html>
